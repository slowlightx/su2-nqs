[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "su2-peps-vmc"
version = "0.1.0"
description = "Isolated finite SU(2)-PEPS VMC validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "jax>=0.4.30", "opt_einsum>=3.3"]

[tool.setuptools.packages.find]
include = ["peps_vmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
